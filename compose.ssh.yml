services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  worker:
    # The host VPN route is not visible on the compose bridge. Host networking
    # lets this process reach MN5, and Postgres is published only on localhost.
    network_mode: host
    user: "0:0"
    environment:
      DATABASE_URL: postgresql+psycopg://residue:${POSTGRES_PASSWORD:-residue-dev}@127.0.0.1:5432/residue_annotation
      HPC_EXECUTION_MODE: ssh
      HPC_INPUT_TRANSFER_ENABLED: "true"
      HPC_SSH_HOST: ${HPC_SSH_HOST:?Set HPC_SSH_HOST for the SSH profile}
      HPC_SSH_PORT: ${HPC_SSH_PORT:-22}
      HPC_SSH_USERNAME: ${HPC_SSH_USERNAME:?Set HPC_SSH_USERNAME for the SSH profile}
      HPC_SSH_PASSWORD_FILE: /run/secrets/hpc_ssh_password
      HPC_KNOWN_HOSTS_FILE: /run/secrets/hpc_known_hosts
      HPC_REMOTE_ROOT: ${HPC_REMOTE_ROOT:-/gpfs/projects/bsc08/bsc001997/vcfs_1000geno/hilo_integrado_anotacion}
      HPC_INPUT_REMOTE_SUBDIR: ${HPC_INPUT_REMOTE_SUBDIR:-uploads}
      HPC_SLURM_ACCOUNT: ${HPC_SLURM_ACCOUNT:-}
      HPC_SLURM_PARTITION: ${HPC_SLURM_PARTITION:-}
      HPC_SLURM_QOS: ${HPC_SLURM_QOS:-}
      HPC_SLURM_TIME: ${HPC_SLURM_TIME:-00:30:00}
      HPC_PIPELINE_PYTHON: ${HPC_PIPELINE_PYTHON:-python}
      HPC_PIPELINE_MAIN: ${HPC_PIPELINE_MAIN:-main.py}
      HPC_PIPELINE_MAX_PARALLEL: ${HPC_PIPELINE_MAX_PARALLEL:-1}
      HPC_PIPELINE_CPU_BUDGET: ${HPC_PIPELINE_CPU_BUDGET:-1}
      HPC_MAX_RESULT_BYTES: ${HPC_MAX_RESULT_BYTES:-268435456}
    volumes:
      - type: bind
        source: ${HPC_SSH_PASSWORD_FILE:?Set HPC_SSH_PASSWORD_FILE to a host secret file}
        target: /run/secrets/hpc_ssh_password
        read_only: true
      - type: bind
        source: ${HPC_KNOWN_HOSTS_FILE:?Set HPC_KNOWN_HOSTS_FILE to a verified known_hosts file}
        target: /run/secrets/hpc_known_hosts
        read_only: true
