[project]
name = "residue-annotation-platform"
version = "0.0.0"
description = "Residue annotation platform API and worker."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "paramiko>=3.4",
    "psycopg[binary]>=3.2",
    "PyJWT>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.9",
    "scp>=0.15.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
    "resend>=2.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
