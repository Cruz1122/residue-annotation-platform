services:
  vpn:
    build:
      context: ./infra/mn5-vpn
    init: true
    restart: unless-stopped
    # The VPN is the only container allowed to create the PPP tunnel. It gets
    # DAC_READ_SEARCH only because Docker local preserves the host UID on the
    # protected secret bind mount; it cannot write the mounted secret.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - DAC_READ_SEARCH
    devices:
      - /dev/ppp:/dev/ppp
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:mode=0755
      - /tmp:mode=1777
    environment:
      HPC_VPN_HOST: ${HPC_VPN_HOST:?Set HPC_VPN_HOST for the MN5 VPN}
      HPC_VPN_PORT: ${HPC_VPN_PORT:-443}
      HPC_VPN_USERNAME: ${HPC_VPN_USERNAME:?Set HPC_VPN_USERNAME for the MN5 VPN}
      HPC_VPN_CONFIG_FILE: /etc/openfortivpn/config
      HPC_VPN_PASSWORD_FILE: /run/secrets/hpc_vpn_password
      HPC_VPN_RECONNECT_SECONDS: ${HPC_VPN_RECONNECT_SECONDS:-60}
      HPC_SSH_HOST: ${HPC_SSH_HOST:?Set HPC_SSH_HOST for the MN5 VPN healthcheck}
      HPC_SSH_PORT: ${HPC_SSH_PORT:-22}
    volumes:
      - type: bind
        source: ${HPC_VPN_CONFIG_FILE:-/etc/openfortivpn/config}
        target: /etc/openfortivpn/config
        read_only: true
    secrets:
      - hpc_vpn_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -d /sys/class/net/ppp0 && nc -z -w 5 \"$$HPC_SSH_HOST\" \"$$HPC_SSH_PORT\"",
        ]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: residue_annotation
      POSTGRES_USER: residue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-residue-dev}
    volumes:
      - residue-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U residue -d residue_annotation"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://residue:${POSTGRES_PASSWORD:-residue-dev}@db:5432/residue_annotation
      DATABASE_AUTO_CREATE: "false"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-only-change-this-secret-before-production}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ./backend
    ports:
      - "8742:8742"
    environment:
      APP_NAME: ${APP_NAME:-residue-annotation-platform}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4742}
      DATABASE_URL: postgresql+psycopg://residue:${POSTGRES_PASSWORD:-residue-dev}@db:5432/residue_annotation
      DATABASE_AUTO_CREATE: "false"
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-./data/artifacts}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      DEV_USER_ID: ${DEV_USER_ID:-local-user}
      DEV_PROJECT_ID: ${DEV_PROJECT_ID:-local-project}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-only-change-this-secret-before-production}
      AUTH_TRUSTED_HEADERS_ENABLED: ${AUTH_TRUSTED_HEADERS_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Residue Annotation <onboarding@resend.dev>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4742}
    volumes:
      - residue-artifacts:/app/data/artifacts
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8742"]

  worker:
    build:
      context: ./backend
    init: true
    restart: unless-stopped
    # The worker needs to read the SSH secret, but it receives no host mounts,
    # no NET_ADMIN capability, and no direct host network access. Its
    # DAC_READ_SEARCH capability is read-only and scoped to these secret
    # mounts. It shares only the isolated VPN namespace below.
    network_mode: service:vpn
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4742}
      DATABASE_URL: postgresql+psycopg://residue:${POSTGRES_PASSWORD:-residue-dev}@db:5432/residue_annotation
      DATABASE_AUTO_CREATE: "false"
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-./data/artifacts}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-only-change-this-secret-before-production}
      AUTH_TRUSTED_HEADERS_ENABLED: ${AUTH_TRUSTED_HEADERS_ENABLED:-false}
      HPC_EXECUTION_MODE: ssh
      HPC_SSH_HOST: ${HPC_SSH_HOST:?Set HPC_SSH_HOST for the MN5 worker}
      HPC_SSH_PORT: ${HPC_SSH_PORT:-22}
      HPC_SSH_USERNAME: ${HPC_SSH_USERNAME:?Set HPC_SSH_USERNAME for the MN5 worker}
      HPC_SSH_PASSWORD_FILE: /run/secrets/hpc_ssh_password
      HPC_KNOWN_HOSTS_FILE: /run/secrets/hpc_known_hosts
      HPC_REMOTE_ROOT: ${HPC_REMOTE_ROOT:-/gpfs/projects/bsc08/bsc001997/vcfs_1000geno/hilo_integrado_anotacion}
      HPC_SLURM_ACCOUNT: ${HPC_SLURM_ACCOUNT:-}
      HPC_SLURM_PARTITION: ${HPC_SLURM_PARTITION:-}
      HPC_SLURM_QOS: ${HPC_SLURM_QOS:-}
      HPC_SLURM_TIME: ${HPC_SLURM_TIME:-00:30:00}
      HPC_PIPELINE_PYTHON: ${HPC_PIPELINE_PYTHON:-python}
      HPC_PIPELINE_MAIN: ${HPC_PIPELINE_MAIN:-main.py}
      HPC_PIPELINE_MAX_PARALLEL: ${HPC_PIPELINE_MAX_PARALLEL:-1}
      HPC_PIPELINE_CPU_BUDGET: ${HPC_PIPELINE_CPU_BUDGET:-32}
      HPC_PIPELINE_GPU_BUDGET: ${HPC_PIPELINE_GPU_BUDGET:-1}
      HPC_MAX_RESULT_BYTES: ${HPC_MAX_RESULT_BYTES:-268435456}
      MN5_INSPECTION_ENABLED: ${MN5_INSPECTION_ENABLED:-false}
      MN5_INSPECTION_MODE: ${MN5_INSPECTION_MODE:-disabled}
      MN5_ROOT: ${MN5_ROOT:-/gpfs/projects/bsc08/bsc001997/vcfs_1000geno/hilo_integrado_anotacion}
      MN5_MAX_ENTRIES: ${MN5_MAX_ENTRIES:-100}
      MN5_MAX_PREVIEW_BYTES: ${MN5_MAX_PREVIEW_BYTES:-64000}
      HPC_INPUT_TRANSFER_ENABLED: "true"
      HPC_INPUT_REMOTE_SUBDIR: ${HPC_INPUT_REMOTE_SUBDIR:-uploads}
    volumes:
      - residue-artifacts:/app/data/artifacts
    secrets:
      - hpc_ssh_password
      - hpc_known_hosts
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      vpn:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "4742:4742"
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8742/api/v1}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  residue-postgres-data:
  residue-artifacts:

secrets:
  hpc_vpn_password:
    file: ${HPC_VPN_PASSWORD_FILE:-/dev/null}
  hpc_ssh_password:
    file: ${HPC_SSH_PASSWORD_FILE:-/dev/null}
  hpc_known_hosts:
    file: ${HPC_KNOWN_HOSTS_FILE:-/dev/null}
