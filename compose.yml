x-worker-common: &worker-common
  init: true
  restart: unless-stopped
  # The SSH secret bind mount keeps the host file owner/mode. Match its UID
  # explicitly instead of running the worker as root. Use the backend app
  # group as the worker's primary GID so both services can read the shared
  # artifact volume without making uploaded scientific inputs world-readable.
  user: "${HPC_WORKER_UID:-1000}:${HPC_APP_GID:-999}"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  volumes:
    - residue-artifacts:/app/data/artifacts
  command: ["python", "-m", "app.worker"]

x-platform-environment: &platform-environment
  APP_NAME: ${APP_NAME:-residue-annotation-platform}
  APP_ENV: ${APP_ENV:-development}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4742}
  DATABASE_AUTO_CREATE: "false"
  ARTIFACT_ROOT: ${ARTIFACT_ROOT:-./data/artifacts}
  MAX_SEQUENCE_LENGTH: ${MAX_SEQUENCE_LENGTH:-100000}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
  DEV_USER_ID: ${DEV_USER_ID:-local-user}
  DEV_PROJECT_ID: ${DEV_PROJECT_ID:-local-project}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-only-change-this-secret-before-production}
  AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-15}
  AUTH_REFRESH_TOKEN_DAYS: ${AUTH_REFRESH_TOKEN_DAYS:-30}
  AUTH_VERIFICATION_TOKEN_HOURS: ${AUTH_VERIFICATION_TOKEN_HOURS:-24}
  AUTH_RESET_TOKEN_MINUTES: ${AUTH_RESET_TOKEN_MINUTES:-30}
  AUTH_PASSWORD_MIN_LENGTH: ${AUTH_PASSWORD_MIN_LENGTH:-12}
  AUTH_TRUSTED_HEADERS_ENABLED: ${AUTH_TRUSTED_HEADERS_ENABLED:-false}
  AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
  AUTH_RATE_LIMIT_REGISTER: ${AUTH_RATE_LIMIT_REGISTER:-5}
  AUTH_RATE_LIMIT_LOGIN: ${AUTH_RATE_LIMIT_LOGIN:-10}
  AUTH_RATE_LIMIT_REFRESH: ${AUTH_RATE_LIMIT_REFRESH:-20}
  AUTH_RATE_LIMIT_RESET: ${AUTH_RATE_LIMIT_RESET:-5}
  AUTH_RATE_LIMIT_VERIFY: ${AUTH_RATE_LIMIT_VERIFY:-10}
  AUTH_RATE_LIMIT_IP: ${AUTH_RATE_LIMIT_IP:-50}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4742}
  HPC_EXECUTION_MODE: ${HPC_EXECUTION_MODE:-disabled}
  # Remote Compose profiles use the run-scoped input namespace by default;
  # an explicit false is still available for an operator-approved ambient
  # input deployment.
  HPC_INPUT_TRANSFER_ENABLED: ${HPC_INPUT_TRANSFER_ENABLED:-true}
  HPC_INPUT_REMOTE_SUBDIR: ${HPC_INPUT_REMOTE_SUBDIR:-uploads}
  HPC_SLURM_PARTITION: ${HPC_SLURM_PARTITION:-}
  HPC_SLURM_QOS: ${HPC_SLURM_QOS:-}
  HPC_SLURM_TIME: ${HPC_SLURM_TIME:-00:30:00}
  HPC_PIPELINE_PREFETCH_COMMAND: ${HPC_PIPELINE_PREFETCH_COMMAND:-}
  HPC_AVAILABLE_TECHNICAL_REQUIREMENTS: ${HPC_AVAILABLE_TECHNICAL_REQUIREMENTS:-}
  HPC_PREFLIGHT_RETRY_SECONDS: ${HPC_PREFLIGHT_RETRY_SECONDS:-60}
  HPC_PIPELINE_MAX_PARALLEL: ${HPC_PIPELINE_MAX_PARALLEL:-1}
  HPC_PIPELINE_CPU_BUDGET: ${HPC_PIPELINE_CPU_BUDGET:-32}
  HPC_PIPELINE_GPU_BUDGET: ${HPC_PIPELINE_GPU_BUDGET:-1}
  HPC_PIPELINE_PDB_SUBSTITUTION_ENABLED: ${HPC_PIPELINE_PDB_SUBSTITUTION_ENABLED:-false}
  HPC_MAX_INFLIGHT_STAGES: ${HPC_MAX_INFLIGHT_STAGES:-1}
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2.0}
  WORKER_ID: ${WORKER_ID:-compose-worker}
  RUN_WORKER_LEASE_SECONDS: ${RUN_WORKER_LEASE_SECONDS:-900}
  RUN_WORKER_MAX_ATTEMPTS: ${RUN_WORKER_MAX_ATTEMPTS:-3}
  ANNOTATIONS_DEFAULT_LIMIT: ${ANNOTATIONS_DEFAULT_LIMIT:-20000}

services:
  vpn:
    profiles: ["vpn"]
    build:
      context: ./infra/mn5-vpn
    init: true
    restart: unless-stopped
    # The VPN is the only container allowed to create the PPP tunnel. It gets
    # DAC_READ_SEARCH only because Docker local preserves the host UID on the
    # protected secret bind mount; it cannot write the mounted secret.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - DAC_READ_SEARCH
    devices:
      - /dev/ppp:/dev/ppp
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:mode=0755
      - /tmp:mode=1777
    environment:
      HPC_VPN_HOST: ${HPC_VPN_HOST:-}
      HPC_VPN_PORT: ${HPC_VPN_PORT:-443}
      HPC_VPN_USERNAME: ${HPC_VPN_USERNAME:-}
      HPC_VPN_CONFIG_FILE: /etc/openfortivpn/config
      HPC_VPN_PASSWORD_FILE: /run/secrets/hpc_vpn_password
      HPC_VPN_RECONNECT_SECONDS: ${HPC_VPN_RECONNECT_SECONDS:-60}
      HPC_SSH_HOST: ${HPC_SSH_HOST:-}
      HPC_SSH_PORT: ${HPC_SSH_PORT:-22}
    volumes:
      - type: bind
        # /dev/null keeps the config mount optional when credentials come
        # from HPC_VPN_PASSWORD_FILE. Set HPC_VPN_CONFIG_FILE explicitly to
        # use a protected openfortivpn config containing a cookie/password.
        source: ${HPC_VPN_CONFIG_FILE:-/dev/null}
        target: /etc/openfortivpn/config
        read_only: true
    secrets:
      - hpc_vpn_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -d /sys/class/net/ppp0 && nc -z -w 5 \"$$HPC_SSH_HOST\" \"$$HPC_SSH_PORT\"",
        ]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: residue_annotation
      POSTGRES_USER: residue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-residue-dev}
    volumes:
      - residue-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U residue -d residue_annotation"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend
    environment:
      <<: *platform-environment
      DATABASE_URL: postgresql+psycopg://residue:${POSTGRES_PASSWORD:-residue-dev}@db:5432/residue_annotation
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ./backend
    ports:
      - "8742:8742"
    environment:
      <<: *platform-environment
      DATABASE_URL: postgresql+psycopg://residue:${POSTGRES_PASSWORD:-residue-dev}@db:5432/residue_annotation
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Residue Annotation <onboarding@resend.dev>}
    volumes:
      - residue-artifacts:/app/data/artifacts
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8742"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8742/api/v1/health', timeout=3); raise SystemExit(0 if response.status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker-vpn:
    <<: *worker-common
    profiles: ["vpn"]
    build:
      context: ./backend
    # The worker needs to read the SSH secret, but it receives no host mounts,
    # no NET_ADMIN capability, and no direct host network access. Its
    # It shares only the isolated VPN namespace below and runs without extra
    # capabilities. The configured worker UID reads the mode-0600 SSH secret.
    network_mode: service:vpn
    group_add:
      - "${HPC_APP_GID:-999}"
    environment:
      <<: *platform-environment
      DATABASE_URL: postgresql+psycopg://residue:${POSTGRES_PASSWORD:-residue-dev}@db:5432/residue_annotation
      HPC_EXECUTION_MODE: ssh
      HPC_SSH_HOST: ${HPC_SSH_HOST:-}
      HPC_SSH_PORT: ${HPC_SSH_PORT:-22}
      HPC_SSH_USERNAME: ${HPC_SSH_USERNAME:-}
      HPC_SSH_PASSWORD_FILE: /run/secrets/hpc_ssh_password
      HPC_KNOWN_HOSTS_FILE: /run/secrets/hpc_known_hosts
      HPC_REMOTE_ROOT: ${HPC_REMOTE_ROOT:-/gpfs/projects/bsc08/bsc001997/vcfs_1000geno/hilo_integrado_anotacion}
      HPC_REMOTE_WORKDIR: ${HPC_REMOTE_WORKDIR:-}
      HPC_COMMAND_TIMEOUT_SECONDS: ${HPC_COMMAND_TIMEOUT_SECONDS:-30.0}
      HPC_SLURM_ACCOUNT: ${HPC_SLURM_ACCOUNT:-}
      HPC_SLURM_PARTITION: ${HPC_SLURM_PARTITION:-}
      HPC_SLURM_QOS: ${HPC_SLURM_QOS:-}
      HPC_SLURM_TIME: ${HPC_SLURM_TIME:-00:30:00}
      HPC_PIPELINE_PYTHON: ${HPC_PIPELINE_PYTHON:-python}
      HPC_PIPELINE_MAIN: ${HPC_PIPELINE_MAIN:-main.py}
      HPC_PIPELINE_PREFETCH_COMMAND: ${HPC_PIPELINE_PREFETCH_COMMAND:-}
      HPC_AVAILABLE_TECHNICAL_REQUIREMENTS: ${HPC_AVAILABLE_TECHNICAL_REQUIREMENTS:-}
      HPC_PREFLIGHT_RETRY_SECONDS: ${HPC_PREFLIGHT_RETRY_SECONDS:-60}
      HPC_PIPELINE_MAX_PARALLEL: ${HPC_PIPELINE_MAX_PARALLEL:-1}
      HPC_PIPELINE_CPU_BUDGET: ${HPC_PIPELINE_CPU_BUDGET:-32}
      HPC_PIPELINE_GPU_BUDGET: ${HPC_PIPELINE_GPU_BUDGET:-1}
      HPC_PIPELINE_PDB_SUBSTITUTION_ENABLED: ${HPC_PIPELINE_PDB_SUBSTITUTION_ENABLED:-false}
      HPC_MAX_RESULT_BYTES: ${HPC_MAX_RESULT_BYTES:-268435456}
      HPC_MAX_ARTIFACT_ENTRIES: ${HPC_MAX_ARTIFACT_ENTRIES:-10000}
      HPC_MAX_INFLIGHT_STAGES: ${HPC_MAX_INFLIGHT_STAGES:-1}
      MN5_INSPECTION_ENABLED: ${MN5_INSPECTION_ENABLED:-false}
      MN5_INSPECTION_MODE: ${MN5_INSPECTION_MODE:-disabled}
      MN5_ROOT: ${MN5_ROOT:-/gpfs/projects/bsc08/bsc001997/vcfs_1000geno/hilo_integrado_anotacion}
      MN5_MAX_ENTRIES: ${MN5_MAX_ENTRIES:-100}
      MN5_MAX_PREVIEW_BYTES: ${MN5_MAX_PREVIEW_BYTES:-64000}
      HPC_INPUT_TRANSFER_ENABLED: "true"
      HPC_INPUT_REMOTE_SUBDIR: ${HPC_INPUT_REMOTE_SUBDIR:-uploads}
    volumes:
      - residue-artifacts:/app/data/artifacts
    secrets:
      - hpc_ssh_password
      - hpc_known_hosts
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      vpn:
        condition: service_healthy

  worker-mn5:
    <<: *worker-common
    profiles: ["mn5"]
    # The MN5 image is provisioned on the cluster and must already contain
    # the application, Python dependencies and Slurm client/auth tooling.
    # This service intentionally has no build context: the workstation image
    # has no sbatch/squeue/sacct/scancel client and cannot submit native jobs.
    image: ${HPC_NATIVE_WORKER_IMAGE:-residue-annotation-platform-worker-native}
    # This profile is deployed on a MareNostrum host. It executes sbatch,
    # squeue, sacct and scancel locally and never starts a VPN or SSH client.
    # The selected image must contain the MN5 Slurm client and its auth setup.
    user: "${HPC_NATIVE_UID:-999}:${HPC_NATIVE_GID:-999}"
    # Native execution uses a different primary account but must still read
    # backend-owned uploads and publish artifacts for the API. The shared app
    # group is supplemental so the native account keeps its cluster GID.
    group_add:
      - "${HPC_APP_GID:-999}"
    environment:
      <<: *platform-environment
      DATABASE_URL: postgresql+psycopg://residue:${POSTGRES_PASSWORD:-residue-dev}@db:5432/residue_annotation
      HPC_EXECUTION_MODE: native
      HPC_INPUT_TRANSFER_ENABLED: "true"
      HPC_INPUT_REMOTE_SUBDIR: ${HPC_INPUT_REMOTE_SUBDIR:-uploads}
      HPC_REMOTE_ROOT: ${HPC_REMOTE_ROOT:-/gpfs/projects/bsc08/bsc001997/vcfs_1000geno/hilo_integrado_anotacion}
      HPC_REMOTE_WORKDIR: ${HPC_REMOTE_WORKDIR:-}
      HPC_COMMAND_TIMEOUT_SECONDS: ${HPC_COMMAND_TIMEOUT_SECONDS:-30.0}
      HPC_SLURM_ACCOUNT: ${HPC_SLURM_ACCOUNT:-}
      HPC_SLURM_PARTITION: ${HPC_SLURM_PARTITION:-}
      HPC_SLURM_QOS: ${HPC_SLURM_QOS:-}
      HPC_SLURM_TIME: ${HPC_SLURM_TIME:-00:30:00}
      HPC_PIPELINE_PYTHON: ${HPC_PIPELINE_PYTHON:-python}
      HPC_PIPELINE_MAIN: ${HPC_PIPELINE_MAIN:-main.py}
      HPC_PIPELINE_PREFETCH_COMMAND: ${HPC_PIPELINE_PREFETCH_COMMAND:-}
      HPC_AVAILABLE_TECHNICAL_REQUIREMENTS: ${HPC_AVAILABLE_TECHNICAL_REQUIREMENTS:-}
      HPC_PREFLIGHT_RETRY_SECONDS: ${HPC_PREFLIGHT_RETRY_SECONDS:-60}
      HPC_PIPELINE_MAX_PARALLEL: ${HPC_PIPELINE_MAX_PARALLEL:-1}
      HPC_PIPELINE_CPU_BUDGET: ${HPC_PIPELINE_CPU_BUDGET:-32}
      HPC_PIPELINE_GPU_BUDGET: ${HPC_PIPELINE_GPU_BUDGET:-1}
      HPC_MAX_RESULT_BYTES: ${HPC_MAX_RESULT_BYTES:-268435456}
      HPC_MAX_ARTIFACT_ENTRIES: ${HPC_MAX_ARTIFACT_ENTRIES:-10000}
      HPC_MAX_INFLIGHT_STAGES: ${HPC_MAX_INFLIGHT_STAGES:-1}
      MN5_INSPECTION_ENABLED: ${MN5_INSPECTION_ENABLED:-false}
      MN5_INSPECTION_MODE: ${MN5_INSPECTION_MODE:-disabled}
      MN5_ROOT: ${MN5_ROOT:-/gpfs/projects/bsc08/bsc001997/vcfs_1000geno/hilo_integrado_anotacion}
      MN5_MAX_ENTRIES: ${MN5_MAX_ENTRIES:-100}
      MN5_MAX_PREVIEW_BYTES: ${MN5_MAX_PREVIEW_BYTES:-64000}
      PATH: ${HPC_NATIVE_PATH:-/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}
    volumes:
      - residue-artifacts:/app/data/artifacts
      - type: bind
        source: ${HPC_NATIVE_ROOT:-/gpfs/projects/bsc08/bsc001997/vcfs_1000geno/hilo_integrado_anotacion}
        target: ${HPC_REMOTE_ROOT:-/gpfs/projects/bsc08/bsc001997/vcfs_1000geno/hilo_integrado_anotacion}
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${HPC_NATIVE_SLURM_CONFIG_DIR:-/etc/slurm}
        target: /etc/slurm
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HPC_NATIVE_MUNGE_DIR:-/run/munge}
        target: /run/munge
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        for executable in sbatch squeue sacct scancel; do
          command -v "$$executable" >/dev/null || {
            echo "native MN5 worker requires $$executable in HPC_NATIVE_WORKER_IMAGE" >&2
            exit 78
          }
        done
        test -d "$$HPC_REMOTE_ROOT" || {
          echo "native MN5 worker requires the mounted GPFS root" >&2
          exit 78
        }
        exec python -m app.worker

  frontend:
    build:
      context: ./frontend
    ports:
      - "4742:4742"
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8742/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  residue-postgres-data:
  residue-artifacts:

secrets:
  hpc_vpn_password:
    file: ${HPC_VPN_PASSWORD_FILE:-/dev/null}
  hpc_ssh_password:
    file: ${HPC_SSH_PASSWORD_FILE:-/dev/null}
  hpc_known_hosts:
    file: ${HPC_KNOWN_HOSTS_FILE:-/dev/null}
