name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rap
          POSTGRES_PASSWORD: rap
          POSTGRES_DB: rap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rap -d rap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check app alembic tests
      - run: uv run ruff format --check app alembic tests
      - run: uv run pytest -q
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://rap:rap@127.0.0.1:5432/rap_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test
      - run: corepack pnpm check
      - run: corepack pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/secret_scan.py

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Validate VPN Compose profile
        run: docker compose --env-file .env.example --profile vpn config --quiet
      - name: Validate native MN5 Compose profile
        run: docker compose --env-file .env.example --profile mn5 config --quiet
